<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ file_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background:#111; color:#eee; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
        .card { background:#1c1c1c; padding:2rem; border-radius:12px; text-align:center; max-width:90%; }
        h2 { word-break:break-word; }
        a.btn { display:inline-block; margin-top:1rem; padding:0.75rem 1.5rem; background:#2b90d9; color:#fff; text-decoration:none; border-radius:8px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>{{ file_name }}</h2>
        <p>Size: {{ file_size }}</p>
        <a class="btn" href="{{ file_url }}">Download</a>
    </div>
</body>
</html>
