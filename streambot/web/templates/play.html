<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ file_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background:#000; color:#eee; margin:0; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
        video { max-width:100%; max-height:80vh; }
        .info { margin-top:1rem; text-align:center; }
        a.btn { display:inline-block; margin-top:0.5rem; padding:0.5rem 1.25rem; background:#2b90d9; color:#fff; text-decoration:none; border-radius:8px; }
    </style>
</head>
<body>
    <video controls autoplay src="{{ file_url }}"></video>
    <div class="info">
        <div>{{ file_name }} ({{ file_size }})</div>
        <a class="btn" href="{{ file_url }}">Download</a>
    </div>
</body>
</html>
